name: Update Dota team coaching data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update.mjs'
      - 'scripts/build-index.mjs'
      - 'scripts/enrich-team.mjs'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: dota-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch OpenDota and build duo feeds
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: node scripts/update.mjs
      - name: Build compact index and per-match reports
        run: node scripts/build-index.mjs
      - name: Enrich reports with full 5v5 coaching context
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: node scripts/enrich-team.mjs
      - name: Commit data if changed
        run: |
          git config user.name "dota-duo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/report.json data/index.json data/matches
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: update ranked matches with team coaching context"
          git push
